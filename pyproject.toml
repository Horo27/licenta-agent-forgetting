[project]
name = "fademem"
version = "0.1.0"
description = "Reproduction of FadeMem (arXiv 2601.18642) and extensions: learned importance, multimodal forgetting"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
fademem = "fademem.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
